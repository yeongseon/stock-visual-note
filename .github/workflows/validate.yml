name: Validate Content

on:
  push:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'requirements.txt'
      - 'STYLE_GUIDE.md'
      - 'content-catalog.yaml'
  pull_request:
    paths:
      - 'content/**'
      - 'scripts/**'
      - 'tests/**'
      - 'templates/**'
      - 'requirements.txt'
      - 'STYLE_GUIDE.md'
      - 'content-catalog.yaml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run validator (strict)
        run: python scripts/validate.py --strict

      - name: Build smoke test (dry-run)
        run: python scripts/build_tistory.py --all --dry-run

      - name: Run tests
        run: pytest tests/ -v
